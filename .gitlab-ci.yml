# use the official gcc image, based on debian
# can use versions as well, like gcc:5.2
# see https://hub.docker.com/_/gcc/

image: gcc

build:
  stage: build
  # instead of calling g++ directly you can also use some build toolkit like make
  # install the necessary build tools when needed
  before_script:
    - apt update && apt -y install make autoconf cmake 
  # 1) Remove existing build files
  #- rm -rf builds_debug
  #- mkdir builds_debug
  # 2) Get latest repository changes and move into builds_dir
  #- cd open-csmp
  #- git fetch
  #- git switch development 
  #- git pull origin 
  #- cd ../builds_debug

  script:
      # 1) Get latest repository changes
     - git fetch
     - git switch development 
     - git pull origin 
      # 2) Remove existing build files and move into it 
     - rm -rf ../builds_debug
     - mkdir ../builds_debug
     - cd ../builds_debug
      # 3) Run CMake and Make: generate build files 
     - cmake -S ../open-csmp/ -B .
     - cmake --build . --target all -j 4. #TODO Change 4 to nproc

# run tests using the binary built before
test:
  stage: test
  script:
     - cp -r ../open-csmp/tests/dataset . 
     - cd dataset
     - ../tests/csmptest_development #CHECK THIS WORKS
     # - .tests/csmptests_main. #Replace with SKM test 
    #- ./runmytests.sh
